name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PNPM
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install

    - name: Tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: minor

    - name: Get all tags
      uses: octokit/request-action@v2.x
      id: get_latest_release
      with:
        route: GET /repos/${{ github.repository }}/git/matching-refs/tags
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Ensure signing key
      id: ensure_key
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p certs

        write_key_from_input() {
          input="$1"
          if echo "$input" | grep -q "-----BEGIN"; then
            printf '%s\n' "$input" > ./certs/encrypted_key.pem
          else
            echo "$input" | tr -d '\r\n' | base64 -d > ./certs/encrypted_key.pem
          fi
        }

        if [ -n "${{ secrets.KEY }}" ]; then
          echo "Using KEY secret from repository"
          write_key_from_input "${{ secrets.KEY }}"
          echo "KEY<<EOF" >> $GITHUB_ENV
          cat ./certs/encrypted_key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "KEY_PASSPHRASE=${{ secrets.KEY_PASSPHRASE }}" >> $GITHUB_ENV
        else
          echo "No KEY secret — generating ephemeral RSA key (not persisted)"
          openssl genpkey -algorithm RSA -out ./certs/encrypted_key.pem -pkeyopt rsa_keygen_bits:2048
          echo "KEY<<EOF" >> $GITHUB_ENV
          cat ./certs/encrypted_key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "KEY_PASSPHRASE=" >> $GITHUB_ENV
          pem_b64=$(cat ./certs/encrypted_key.pem | base64 -w0)
          echo "::add-mask::$pem_b64"
        fi

    - name: Build
      run: pnpm bump && pnpm build
      env:
        VERSION: ${{ steps.tag_version.outputs.new_tag }}
        TAGS: ${{ steps.get_latest_release.outputs.data }}

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        body: ${{ steps.tag_version.outputs.changelog }}
        artifacts: './dist/iwa-sink.swbn,./update.json,./extension/IwaKitchenSinkExtension.crx,./extension/extension_manifest.xml'
